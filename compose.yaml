name: online-cinema

x-broker: &broker
  image: apache/kafka:4.0.1
  healthcheck:
    test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms32m -Xmx96m' /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
    interval: 30s
    timeout: 12s
    retries: 8
    start_period: 10s

x-kafka-env: &kafka-env
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_LISTENERS: BROKER://:9092,CONTROLLER://:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms96m -Xmx192m
  KAFKA_NUM_NETWORK_THREADS: "2"
  KAFKA_NUM_IO_THREADS: "3"

x-app: &app
  image: hse-soa-online-cinema:dev
  build: .
  environment: &app-env
    KAFKA_BOOTSTRAP: kafka1:9092,kafka2:9092,kafka3:9092
    SCHEMA_REGISTRY: http://registry:8081
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_USER: cinema
    CLICKHOUSE_PASSWORD: cinema
    POSTGRES_DSN: postgresql://cinema:cinema@postgres:5432/cinema
    S3_ENDPOINT: http://object-storage:8333
    AWS_ACCESS_KEY_ID: cinema-admin
    AWS_SECRET_ACCESS_KEY: cinema-local-secret
    AWS_DEFAULT_REGION: us-east-1

services:
  kafka1:
    <<: *broker
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka1:9092
    volumes: [kafka1:/var/lib/kafka/data]
  kafka2:
    <<: *broker
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka2:9092
    volumes: [kafka2:/var/lib/kafka/data]
  kafka3:
    <<: *broker
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka3:9092
    volumes: [kafka3:/var/lib/kafka/data]
  registry:
    image: confluentinc/cp-schema-registry:7.9.2
    environment:
      SCHEMA_REGISTRY_HOST_NAME: registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka1:9092,PLAINTEXT://kafka2:9092,PLAINTEXT://kafka3:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: "3"
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms64m -Xmx192m
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 24
    ports: ["127.0.0.1:8081:8081"]
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes: [clickhouse:/var/lib/clickhouse]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 4s
      retries: 30
    ports: ["127.0.0.1:8123:8123"]
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
      POSTGRES_DB: cinema
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema -h 127.0.0.1"]
      interval: 5s
      timeout: 4s
      retries: 20
  object-storage:
    image: chrislusf/seaweedfs:4.31
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: cinema-admin
      AWS_SECRET_ACCESS_KEY: cinema-local-secret
    volumes: [object-storage:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 4s
      retries: 20
  bootstrap:
    <<: *app
    command: python -m cinema.bootstrap
    depends_on:
      registry: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      postgres: {condition: service_healthy}
      object-storage: {condition: service_healthy}
  producer:
    <<: *app
    command: uvicorn cinema.producer:app --host 0.0.0.0 --port 8000
    environment:
      <<: *app-env
      GENERATOR_INTERVAL_SECONDS: ${GENERATOR_INTERVAL_SECONDS:-0}
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8050:8000"]
    healthcheck: &http-health
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 4s
      retries: 20
  aggregation:
    <<: *app
    command: uvicorn cinema.aggregation:app --host 0.0.0.0 --port 8000
    environment:
      <<: *app-env
      AGGREGATION_INTERVAL_SECONDS: ${AGGREGATION_INTERVAL_SECONDS:-60}
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8051:8000"]
    healthcheck: *http-health
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.23.5
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    ports: ["127.0.0.1:3050:3000"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 4s
      retries: 30
  integration:
    <<: *app
    profiles: [test]
    command: python -m tests.integration
    depends_on:
      producer: {condition: service_healthy}
      aggregation: {condition: service_healthy}
      grafana: {condition: service_healthy}

volumes:
  kafka1:
  kafka2:
  kafka3:
  clickhouse:
  postgres:
  object-storage:
  grafana:
